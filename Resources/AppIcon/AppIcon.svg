      <path transform="translate(0 130) rotate(-32)" d="M 15 -15 V 5 H -14 M -4 -5 L -14 5 L -4 15" fill="none" stroke="#3DFF7F" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" filter="url(#softglow)"/>
