<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4CCA"/>
      <stop offset="1" stop-color="#7B2FD0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA0AC"/>
      <stop offset="0.35" stop-color="#F2F4F7"/>
      <stop offset="0.65" stop-color="#D5D9E0"/>
      <stop offset="1" stop-color="#7D8390"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB46B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF7A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="next" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA552"/>
      <stop offset="1" stop-color="#F0602A"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4F5C"/>
      <stop offset="1" stop-color="#23262E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824pt rounded square centred on a 1024 canvas -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g transform="translate(455 590) rotate(32) scale(0.92)">
    <!-- voice waves coming off the top of the clicker -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="30">
      <path d="M -62 -332 A 88 88 0 0 1 62 -332" stroke-opacity="0.95"/>
      <path d="M -118 -380 A 165 165 0 0 1 118 -380" stroke-opacity="0.7"/>
      <path d="M -172 -428 A 240 240 0 0 1 172 -428" stroke-opacity="0.45"/>
    </g>
    <!-- clicker -->
    <rect x="-88" y="-290" width="176" height="580" rx="88" fill="url(#body)" filter="url(#shadow)"/>
    <rect x="-88" y="-290" width="176" height="580" rx="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/>
    <!-- pointer button -->
    <circle cx="0" cy="-185" r="30" fill="url(#btn)"/>
    <!-- next button, lit: it starts dictation -->
    <circle cx="0" cy="-30" r="100" fill="url(#glow)"/>
    <circle cx="0" cy="-30" r="58" fill="url(#next)"/>
    <circle cx="0" cy="-30" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4"/>
    <!-- back button, sends Enter -->
    <circle cx="0" cy="130" r="40" fill="url(#btn)"/>
    <path transform="translate(0 130) rotate(-32)" d="M 15 -15 V 5 H -14 M -4 -5 L -14 5 L -4 15" fill="none" stroke="#C9CDD6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
