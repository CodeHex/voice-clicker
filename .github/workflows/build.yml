name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app
        run: ditto -c -k --keepParent "build/Voice Clicker.app" "build/VoiceClicker.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoiceClicker
          path: build/VoiceClicker.zip
