name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the relay protocol (Swift side)
        run: swift run relay-protocol-check
      - name: Check the relay protocol (Pi side)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet cryptography==43.0.0  # the version Raspberry Pi OS ships
          cd relay && /tmp/venv/bin/python -m unittest discover -s tests -t .
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app
        run: ditto -c -k --keepParent "build/Voice Clicker.app" "build/VoiceClicker.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoiceClicker
          path: build/VoiceClicker.zip
